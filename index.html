<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>I-STEM Software Directory — Demo (with dummy data)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        padding: 1.5rem;
      }
      .card-software {
        cursor: pointer;
      }
      .small-muted {
        font-size: 0.85rem;
        color: #6c757d;
      }
      .tag {
        display: inline-block;
        padding: 0.15rem 0.5rem;
        border-radius: 0.25rem;
        background: #f1f3f5;
        margin-right: 0.25rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="d-flex align-items-center mb-3">
        <h1 class="me-auto">I-STEM Software Directory — Demo</h1>
        <div>
          <button id="btnExport" class="btn btn-outline-primary btn-sm">
            Export CSV
          </button>
          <button id="btnClear" class="btn btn-outline-danger btn-sm">
            Clear Data
          </button>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-lg-4">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Add / Register Institution</h5>
              <form id="institutionForm">
                <div class="mb-2">
                  <label class="form-label">Institution Name</label>
                  <input class="form-control" required id="instName" />
                </div>
                <div class="mb-2">
                  <label class="form-label">Type</label>
                  <select class="form-select" id="instType">
                    <option>IIT</option>
                    <option>IISc</option>
                    <option>NIT</option>
                    <option>IIIT</option>
                    <option>Central University</option>
                    <option>State University</option>
                    <option>Private University</option>
                    <option>Research Institute</option>
                    <option>Other</option>
                  </select>
                </div>
                <div class="mb-2">
                  <label class="form-label">City / State</label>
                  <input class="form-control" id="instCity" />
                </div>
                <div class="mb-2">
                  <label class="form-label">Website URL</label>
                  <input class="form-control" id="instWeb" />
                </div>

                <hr />
                <h6>Authorized Contact</h6>
                <div class="mb-2">
                  <input
                    class="form-control"
                    placeholder="Name"
                    id="contactName"
                  />
                </div>
                <div class="mb-2">
                  <input
                    class="form-control"
                    placeholder="Designation"
                    id="contactDesg"
                  />
                </div>
                <div class="mb-2">
                  <input
                    class="form-control"
                    placeholder="Email"
                    id="contactEmail"
                  />
                </div>
                <div class="mb-2">
                  <input
                    class="form-control"
                    placeholder="Phone"
                    id="contactPhone"
                  />
                </div>

                <hr />
                <h6>Software (first entry)</h6>
                <div class="mb-2">
                  <input
                    class="form-control"
                    placeholder="Software name"
                    id="swName"
                  />
                </div>
                <div class="mb-2">
                  <select class="form-select" id="swType">
                    <option>Commercial</option>
                    <option>Open Source</option>
                    <option>Academic / Research License</option>
                  </select>
                </div>
                <div class="mb-2">
                  <input
                    class="form-control"
                    placeholder="Version / Module"
                    id="swVersion"
                  />
                </div>
                <div class="mb-2">
                  <input
                    class="form-control"
                    placeholder="Total number of licenses (or 'unlimited')"
                    id="swCount"
                  />
                </div>
                <div class="mb-2">
                  <select class="form-select" id="swAccess">
                    <option>
                      Available for external users (on request and approval)
                    </option>
                    <option>Restricted to internal use only</option>
                    <option>
                      Available for academic collaborations / MoUs
                    </option>
                  </select>
                </div>
                <div class="mb-2">
                  <textarea
                    class="form-control"
                    rows="2"
                    id="swRemarks"
                    placeholder="Additional remarks or access conditions"
                  ></textarea>
                </div>

                <div class="d-grid">
                  <button class="btn btn-primary" type="submit">
                    Save Institution + Software
                  </button>
                </div>
              </form>

              <div class="mt-3">
                <small class="small-muted"
                  >This is a demo single-page app that stores data in your
                  browser (localStorage). To make it public, deploy the file or
                  connect it to a server/backend.</small
                >
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="mb-3 d-flex">
            <input
              id="search"
              class="form-control me-2"
              placeholder="Search software, institution, city..."
            />
            <select
              id="filterType"
              class="form-select me-2"
              style="max-width: 220px"
            >
              <option value="">All types</option>
              <option>Commercial</option>
              <option>Open Source</option>
              <option>Academic / Research License</option>
            </select>
            <button id="btnNewInst" class="btn btn-outline-secondary">
              New Entry
            </button>
          </div>

          <div id="list" class="row gy-3"></div>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Software details</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div id="modalBody"></div>
            <hr />
            <div>
              <h6>Actions</h6>
              <div class="d-flex gap-2">
                <button id="btnRequest" class="btn btn-primary">
                  Request Access (log)
                </button>
                <button id="btnMarkUsed" class="btn btn-success">
                  Mark as Used
                </button>
              </div>
            </div>
            <hr />
            <div>
              <h6>Access / Usage Log</h6>
              <div id="logArea"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const STORAGE_KEY = "istem_software_directory_v1";
      const LOG_KEY = "istem_access_logs_v1";

      function loadData() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch (e) {
          return [];
        }
      }
      function saveData(d) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
      }
      function loadLogs() {
        try {
          return JSON.parse(localStorage.getItem(LOG_KEY)) || [];
        } catch (e) {
          return [];
        }
      }
      function saveLogs(l) {
        localStorage.setItem(LOG_KEY, JSON.stringify(l));
      }

      let data = loadData();
      let logs = loadLogs();

      // --- Add dummy data if empty ---
      if (data.length === 0) {
        data = [
          {
            id: "inst1",
            name: "IIT Delhi",
            type: "IIT",
            city: "Delhi",
            website: "https://iitd.ac.in",
            contact: {
              name: "Dr. Arjun Mehta",
              designation: "Professor",
              email: "arjun@iitd.ac.in",
              phone: "+91-9876543210",
            },
            software: [
              {
                id: "sw_comsol1",
                name: "COMSOL Multiphysics",
                type: "Commercial",
                version: "6.0",
                count: "25",
                access:
                  "Available for external users (on request and approval)",
                remarks: "Used for multiphysics simulations in engineering.",
              },
              {
                id: "sw_matlab1",
                name: "MATLAB",
                type: "Commercial",
                version: "R2023a",
                count: "500",
                access: "Restricted to internal use only",
                remarks: "Campus-wide academic license.",
              },
            ],
          },
          {
            id: "inst2",
            name: "IIT Madras",
            type: "IIT",
            city: "Chennai, Tamil Nadu",
            website: "https://iitm.ac.in",
            contact: {
              name: "Dr. Priya Iyer",
              designation: "Head, HPC Lab",
              email: "priya@iitm.ac.in",
              phone: "+91-9988776655",
            },
            software: [
              {
                id: "sw_comsol2",
                name: "COMSOL Multiphysics",
                type: "Commercial",
                version: "6.1",
                count: "30",
                access:
                  "Available for academic collaborations / MoUs",
                remarks:
                  "Includes CFD and electromagnetics modules. Accessible via cluster login.",
              },
              {
                id: "sw_matlab2",
                name: "MATLAB",
                type: "Commercial",
                version: "R2024a",
                count: "100",
                access:
                  "Available for external users (on request and approval)",
                remarks: "Used in coursework and sponsored research.",
              },
            ],
          },
          {
            id: "inst3",
            name: "NIT Trichy",
            type: "NIT",
            city: "Tiruchirappalli, Tamil Nadu",
            website: "https://nitt.edu",
            contact: {
              name: "Dr. K. Ramesh",
              designation: "Associate Professor",
              email: "ramesh@nitt.edu",
              phone: "+91-9123456789",
            },
            software: [
              {
                id: "sw_comsol3",
                name: "COMSOL Multiphysics",
                type: "Commercial",
                version: "5.6",
                count: "15",
                access:
                  "Restricted to internal use only",
                remarks: "Used in M.Tech projects.",
              },
              {
                id: "sw_matlab3",
                name: "MATLAB",
                type: "Commercial",
                version: "R2022b",
                count: "200",
                access:
                  "Available for academic collaborations / MoUs",
                remarks: "Available for joint research.",
              },
            ],
          },
          {
            id: "inst4",
            name: "IISc Bangalore",
            type: "IISc",
            city: "Bangalore, Karnataka",
            website: "https://iisc.ac.in",
            contact: {
              name: "Dr. Shweta Rao",
              designation: "Systems Admin",
              email: "shweta@iisc.ac.in",
              phone: "+91-9012345678",
            },
            software: [
              {
                id: "sw_matlab4",
                name: "MATLAB",
                type: "Commercial",
                version: "R2023a",
                count: "300",
                access:
                  "Available for academic collaborations / MoUs",
                remarks: "Includes Simulink and deep learning toolboxes.",
              },
            ],
          },
          {
            id: "inst5",
            name: "IIIT Hyderabad",
            type: "IIIT",
            city: "Hyderabad, Telangana",
            website: "https://iiit.ac.in",
            contact: {
              name: "Prof. S. Nair",
              designation: "Dean, R&D",
              email: "nair@iiit.ac.in",
              phone: "+91-9090909090",
            },
            software: [
              {
                id: "sw_matlab5",
                name: "MATLAB",
                type: "Commercial",
                version: "R2021b",
                count: "150",
                access: "Restricted to internal use only",
                remarks: "Used for AI/ML research projects.",
              },
            ],
          },
          {
            id: "inst6",
            name: "Central University of Kerala",
            type: "Central University",
            city: "Kasaragod, Kerala",
            website: "https://cukerala.ac.in",
            contact: {
              name: "Dr. Thomas Mathew",
              designation: "Associate Professor",
              email: "thomas@cuk.ac.in",
              phone: "+91-8899776655",
            },
            software: [
              {
                id: "sw_converter1",
                name: "Data Converter",
                type: "Open Source",
                version: "1.0",
                count: "unlimited",
                access:
                  "Available for external users (on request and approval)",
                remarks: "Simple open-source data format converter.",
              },
            ],
          },
        ];
        saveData(data);
      }

      let form = document.getElementById("institutionForm");
      let list = document.getElementById("list");
      let search = document.getElementById("search");
      let filterType = document.getElementById("filterType");

      function escapeHtml(s) {
        return (s || "")
          .toString()
          .replace(/[&<>\"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      }

      function renderList() {
        const q = search.value.trim().toLowerCase();
        const typeFilter = filterType.value;
        list.innerHTML = "";
        const rows = [];
        data.forEach((inst) => (inst.software || []).forEach((sw) => rows.push({ inst, sw })));
        const filtered = rows.filter((r) => {
          if (typeFilter && r.sw.type !== typeFilter) return false;
          if (!q) return true;
          return (
            r.sw.name + " " + r.inst.name + " " + (r.inst.city || "") + " " + (r.sw.remarks || "")
          )
            .toLowerCase()
            .includes(q);
        });

        if (filtered.length === 0) {
          list.innerHTML = '<div class="col-12"><div class="alert alert-info">No results found.</div></div>';
          return;
        }

        filtered.forEach((item) => {
          const col = document.createElement("div");
          col.className = "col-md-6";
          const card = document.createElement("div");
          card.className = "card card-software";
          card.innerHTML = `
            <div class="card-body">
              <div class="d-flex">
                <div>
                  <h5 class="card-title mb-1">${escapeHtml(item.sw.name)}</h5>
                  <div class="small-muted mb-2">${escapeHtml(item.inst.name)} — ${escapeHtml(item.inst.city || "")}</div>
                  <div class="mb-1">
                    <span class="tag">${escapeHtml(item.sw.type)}</span>
                    <span class="tag">${escapeHtml(item.sw.version || "")}</span>
                    <span class="tag">${escapeHtml(item.sw.count || "")}</span>
                  </div>
                  <p class="mb-0 small-muted">${escapeHtml((item.sw.remarks || "").slice(0, 120))}${
            (item.sw.remarks || "").length > 120 ? "..." : ""
          }</p>
                </div>
                <div class="ms-auto text-end">
                  <button class="btn btn-sm btn-outline-primary" data-action="view">View</button>
                </div>
              </div>
            </div>`;
          card.querySelector('[data-action="view"]').addEventListener("click", () => openDetails(item));
          col.appendChild(card);
          list.appendChild(col);
        });
      }

      function openDetails(item) {
        const modal = new bootstrap.Modal(document.getElementById("detailsModal"));
        document.getElementById("modalTitle").textContent = item.sw.name + " — " + item.inst.name;
        const b = document.getElementById("modalBody");
        b.innerHTML = `
          <div><strong>Institution:</strong> ${escapeHtml(item.inst.name)} (${escapeHtml(item.inst.type)})</div>
          <div><strong>City:</strong> ${escapeHtml(item.inst.city || "")}</div>
          <div><strong>Website:</strong> <a href="${escapeHtml(item.inst.website)}" target="_blank">${escapeHtml(item.inst.website)}</a></div>
          <hr><h6>Contact</h6>
          <div>${escapeHtml(item.inst.contact.name || "—")} — ${escapeHtml(item.inst.contact.designation || "")}</div>
          <div>Email: <a href="mailto:${escapeHtml(item.inst.contact.email)}">${escapeHtml(item.inst.contact.email)}</a></div>
          <div>Phone: ${escapeHtml(item.inst.contact.phone || "—")}</div>
          <hr><h6>Software</h6>
          <div>Type: ${escapeHtml(item.sw.type)}</div>
          <div>Version: ${escapeHtml(item.sw.version)}</div>
          <div>Licenses: ${escapeHtml(item.sw.count)}</div>
          <div>Access: ${escapeHtml(item.sw.access)}</div>
          <p class="mt-2">${escapeHtml(item.sw.remarks || "")}</p>`;
        document.getElementById("btnRequest").onclick = () => logAction("request_access", item);
        document.getElementById("btnMarkUsed").onclick = () => logAction("mark_used", item);
        renderLogs(item);
        modal.show();
      }

      function logAction(type, item) {
        const entry = {
          id: "log_" + Date.now(),
          ts: new Date().toISOString(),
          type,
          institution: { id: item.inst.id, name: item.inst.name },
          software: { id: item.sw.id, name: item.sw.name },
          user: { name: "anonymous", email: "" },
        };
        logs.unshift(entry);
        saveLogs(logs);
        alert("Action recorded locally.");
        renderLogs(item);
      }

      function renderLogs(item) {
        const area = document.getElementById("logArea");
        const related = logs.filter(
          (l) => l.software.id === item.sw.id && l.institution.id === item.inst.id
        );
        if (related.length === 0) {
          area.innerHTML = '<div class="small-muted">No logs yet for this software.</div>';
          return;
        }
        area.innerHTML = related
          .map(
            (l) =>
              `<div class="mb-2"><strong>${l.type}</strong> — ${new Date(l.ts).toLocaleString()} by ${
                l.user.name
              }</div>`
          )
          .join("");
      }

      document.getElementById("btnClear").addEventListener("click", () => {
        if (confirm("Clear all local demo data?")) {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(LOG_KEY);
          data = [];
          logs = [];
          renderList();
        }
      });

      document.getElementById("btnExport").addEventListener("click", () => {
        const rows = [
          [
            "Institution",
            "Type",
            "City",
            "Website",
            "Contact Name",
            "Contact Designation",
            "Contact Email",
            "Contact Phone",
            "Software Name",
            "Software Type",
            "Version",
            "Licenses",
            "Access",
            "Remarks",
          ],
        ];
        data.forEach((inst) =>
          (inst.software || []).forEach((sw) =>
            rows.push([
              inst.name,
              inst.type,
              inst.city,
              inst.website,
              inst.contact.name,
              inst.contact.designation,
              inst.contact.email,
              inst.contact.phone,
              sw.name,
              sw.type,
              sw.version,
              sw.count,
              sw.access,
              sw.remarks,
            ])
          )
        );
        const csv = rows.map((r) => r.map((c) => `"${String(c || "").replace(/"/g, '""')}"`).join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "istem_software_directory.csv";
        a.click();
        URL.revokeObjectURL(url);
      });

      search.addEventListener("input", renderList);
      filterType.addEventListener("change", renderList);
      renderList();
    </script>
  </body>
</html>
